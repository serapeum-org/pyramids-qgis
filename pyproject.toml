[project]
name = "pyramids-qgis"
version = "0.0.0"
description = "QGIS Processing provider exposing the pyramids GIS toolkit"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = "GPL-3.0-or-later"
keywords = ["GIS", "QGIS", "processing", "plugin", "pyramids", "GDAL", "raster", "vector"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

# pyramids-core needs >= 3.11, so that is the floor for a pip install of this package. The plugin
# *source* still parses on the Python QGIS 3.22 ships (3.9) — the `compile` CI job proves that — but
# pip-installing it (which pulls pyramids-core) requires 3.11+.
requires-python = ">= 3.11, <4"

# PyQGIS is deliberately absent, mirroring how pyramids-mesh omits GDAL: the plugin runs inside
# QGIS, which provides `qgis.*` and GDAL; nothing here installs or pins qgis/PyQGIS. The one runtime
# requirement is pyramids-core (imported lazily by the algorithms); the EO/mesh families are extras.
dependencies = [
    "pyramids-core >=0.77",
]

[project.optional-dependencies]
# Earth-observation algorithms (stretch, tasseled_cap) need pyramids-eo; the mesh algorithms
# (convert, to_vector) need pyramids-mesh. A bare install ships neither; each algorithm guards its
# import and raises a clear "install ..." message when its extra is absent (see dependencies.py).
eo = ["pyramids-eo"]
mesh = ["pyramids-mesh"]
all = ["pyramids-qgis[eo,mesh]"]

[dependency-groups]
dev = [
    "pytest >=8.2.2",
    "pytest-cov >=5.0.0",
    "pre-commit >=3.7.1",
    # Same ruff the pre-commit hooks and the lint workflow pin, so `pixi run -e dev lint` matches CI.
    "ruff ==0.17.3",
    "commitizen >=4.8.4",
    "build >=1.0.0",
    # qgis-plugin-ci's own dependency; the packaging guard reproduces its folder-naming rule
    # (slugify(name, separator="_")) without pulling the whole release tool into the test env.
    "python-slugify >=8.0.0",
    "pip",
]
# Hand-written docs only: NO mkdocstrings. An auto-API reference would import `pyramids_qgis` ->
# `qgis.core`, which the docs CI env does not provide. The build installs just this group (no
# `pip install .`), so the whole site stays QGIS-free — see .github/workflows/github-pages-mkdocs.yml.
# mkdocs-material pulls pymdown-extensions, which backs the pymdownx.* markdown extensions in mkdocs.yml.
docs = [
    "mkdocs >=1.5.3",
    "mkdocs-material >=9.5.3",
    "mike >=2.1.3",
]

[project.urls]
homepage = "https://github.com/serapeum-org/pyramids-qgis"
repository = "https://github.com/serapeum-org/pyramids-qgis"
documentation = "https://serapeum-org.github.io/pyramids-qgis"
Changelog = "https://github.com/serapeum-org/pyramids-qgis/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyramids_qgis", "pyramids_qgis.*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
# Ship the QGIS plugin metadata and icons inside the wheel so an installed/deployed copy carries the
# files QGIS reads (metadata.txt) and renders (resources/).
pyramids_qgis = ["metadata.txt", "resources/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# QGIS mandates camelCase method names (initGui, processAlgorithm, displayName, ...) and
# single-char API names (id); those are silenced inline with per-line noqa, not globally.
select = ["E", "F", "W", "I", "N"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
major_version_zero = true
# Keep the QGIS plugin metadata version in step with the [project] version on every bump.
version_files = [
    "src/pyramids_qgis/metadata.txt:^version",
]

[tool.coverage.run]
branch = true
source = ["src/pyramids_qgis"]

[tool.pytest.ini_options]
# src layout: the package is importable from src/ without an install; scripts/ carries deploy.py.
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
markers = [
    # Real-PyQGIS tests under tests/integration/ (the pixi dev env or the wheel-test job): both the
    # instantiation tests (test_real_qgis.py) and the end-to-end tests (test_end_to_end.py), which
    # run one algorithm per group through `run()` to an actual output. `-m "not integration"` skips
    # these heavier tests but is NOT QGIS-free: every test module imports qgis.core, so the whole
    # suite requires a real QGIS env.
    "integration: exercises the plugin against a real QGIS install",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
# osx-arm64 baseline raised to 14.0 so pixi's `__osx` virtual package satisfies conda-forge qgis's
# `__osx >=13.3` requirement (same fix pyramids-mesh uses). macos-latest runners are >= 14.
platforms = ["win-64", "linux-64", { platform = "osx-arm64", macos = "14.0" }]

[tool.pixi.dependencies]
# The non-PyPI runtime comes from conda-forge: QGIS (PyQGIS) and pyramids-core bound to QGIS's GDAL
# — the real supported setup, not the vendored-GDAL PyPI wheel. No [tool.pixi.pypi-dependencies] and
# no editable self-install: the package is imported from src/ via pytest's `pythonpath`, not pip
# installed into the env. Package metadata still declares pyramids-core in [project.dependencies]
# (PEP 621) for pip/feedstock consumers; dev/docs tooling lives in [dependency-groups] (PEP 735).
qgis = "*"
# conda-forge ships this as `pyramids` (PyPI name is `pyramids-core`; both import as `pyramids`).
pyramids = ">=0.77"

[tool.pixi.tasks]
test = { cmd = "pytest -q --cov=pyramids_qgis --cov-report=term-missing", description = "Run the full suite against real QGIS (this env conda-installs qgis) with coverage" }
lint = { cmd = "ruff check .", description = "Lint with ruff" }
format = { cmd = "ruff format .", description = "Format with ruff" }
compile = { cmd = "python -m compileall -q src/pyramids_qgis scripts", description = "Byte-compile every module" }
build-dist = { cmd = "python -m build", description = "Build the sdist and wheel" }
cz-bump = { cmd = "cz bump", description = "Bump the version with commitizen" }

[tool.pixi.environments]
# conda-forge QGIS 4.x requires Python >= 3.13, so the pixi env is py313 — it cannot be the 3.11-3.14
# matrix a pure-Python package (pyramids-mesh) uses, because `qgis` has no build for the older ones.
# The package itself still targets 3.11+ (requires-python / classifiers) for QGIS 3.x source; this pin
# is only the conda dev/test env that carries real QGIS.
default = { features = ["py313"], solve-group = "default" }
dev = { features = ["py313", "dev", "eo"], solve-group = "default" }
# Docs environment for the shared mkdocs-deploy action (package-manager: pixi, install-groups: docs),
# mirroring pyramids-mesh. `no-default-feature = true` drops the top-level [tool.pixi.dependencies]
# (QGIS + pyramids), so this env carries ONLY python + the [dependency-groups].docs tooling (mkdocs,
# material, mike) — no QGIS, no conda `qgis` in its solve, and the plugin itself is not installed. The
# site is hand-written (no mkdocstrings), so nothing here imports `qgis.core`. Its own solve-group
# keeps it independent of the QGIS dev/test solve.
docs = { features = ["py313", "docs"], solve-group = "docs", no-default-feature = true }
# Qt5 counterpart to `dev`: the SAME suite against the QGIS 3.x / Qt5 line (Qt6 is 4.x), so the
# plugin's advertised QGIS-3.x support is runtime-verified, not just byte-compiled. The `qt5` feature
# pins qgis <4 (Qt5) + python 3.12; its OWN solve-group keeps that resolve independent of the 4.x/py313
# `default` group (one solve-group cannot hold both qgis majors). See tests.yml for the matching job.
qt5 = { features = ["qt5", "dev", "eo"], solve-group = "qt5" }

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.eo.dependencies]
# pyramids-eo (conda-forge) so the EO algorithms' end-to-end tests run in the dev env — the EO
# family calls the library directly (no CLI), so the real package must be importable, bound to the
# same conda GDAL as QGIS and pyramids-core. Kept out of `default` (the build env) so only dev pulls
# it. pyramids-mesh has NO conda-forge build, so it is deliberately NOT added here; the mesh
# end-to-end tests exercise the built-in UGRID NetCDF path, which pyramids-core reads and writes
# without pyramids-mesh. Other mesh-format drivers (2DM, Selafin, ...) still need pyramids-mesh and
# so remain uncovered in CI until it ships on conda-forge.
pyramids-eo = "*"

[tool.pixi.feature.qt5.dependencies]
# The QGIS 3.x / Qt5 LTR line — the counterpart to the Qt6 build the `default`/`dev` envs get from an
# unpinned `qgis` (which resolves 4.x). conda-forge ships qgis 3.x bound to Qt5 (qt-main 5.15 / pyqt
# 5.15); its recent 3.4x builds pair with python 3.12/3.13, which clears pyramids-core's `>=3.11`
# floor. (QGIS 3.22-LTR itself ships python 3.9 — below that floor — so 3.22 cannot import
# pyramids-core and is only byte-compile-checked by the `compile` job, never runtime-tested; the
# runtime-testable Qt5 target is this newer 3.x build.) Pin python to 3.12 and qgis to <4 so the suite
# runs against real Qt5 PyQGIS. pyramids-eo comes from the `eo` feature.
python = "3.12.*"
qgis = ">=3.40,<4"
# Pin pyramids to the SAME line the `dev` (Qt6) solve-group resolves, so this leg varies ONLY the Qt
# major — otherwise its independent solve-group floats pyramids to a newer release and the leg would
# also be a pyramids-version test. (It is on exactly that newer release that the plugin's flat CLI
# argv — `pyramids warp ...` — breaks: pyramids >=0.74 regrouped the CLI into `pyramids raster warp`.
# That is a real, Qt-independent defect affecting the 4.x env too; it is tracked separately, NOT
# worked around here beyond keeping both legs on the same known-good pyramids.)
pyramids = "0.77.*"
