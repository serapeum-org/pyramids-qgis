name: Deploy MkDocs

# Self-contained docs build & deploy. The site is hand-written (no mkdocstrings auto-API reference),
# so the build installs ONLY the `docs` dependency group (mkdocs + material + mike) — never the plugin
# itself (`pip install .`) and never QGIS. This is deliberate: importing `pyramids_qgis` pulls in
# `qgis.core`, which the docs runner does not provide. The pull_request job builds with `--strict` to
# prove the site stays QGIS-free; main pushes and releases deploy versioned docs with `mike`.
#
# Pages source requirement: `mike` publishes by committing the built site to the `gh-pages` branch, so
# the repo's Settings -> Pages -> Build and deployment -> Source must be "Deploy from a branch -> gh-pages".
# If Pages is set to the "GitHub Actions" source instead, the push to `gh-pages` still succeeds and this
# workflow stays green, but nothing is served — a silent no-publish.

permissions:
  contents: read  # write is granted per-job to the deploy jobs only, not to the PR build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows: ['github-release']
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests: build the site and fail on any warning (broken link, missing nav page, …) but never
  # deploy. This is the guard that keeps the docs build self-contained — it installs no QGIS.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      # PEP 735 dependency groups need pip >= 25.1; `--group docs` installs the docs tooling WITHOUT
      # installing this project (no `pip install .`), so the plugin / QGIS never enter the build env.
      - run: python -m pip install --upgrade "pip>=25.1"
      - run: python -m pip install --group docs
      - run: mkdocs build --strict

  # Main branch: deploy the `main` version and make it the default the site opens on.
  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # mike pushes the built site to the gh-pages branch.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # mike needs full history + the gh-pages branch to update it.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade "pip>=25.1"
      - run: python -m pip install --group docs
      - name: Build site (strict)
        # Gate direct pushes to main too: only the pull_request job runs --strict, so without this a
        # commit that reached main outside a PR could deploy a broken link / nav mismatch non-strict.
        run: mkdocs build --strict
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy (mike) — main
        run: |
          mike deploy --push --update-aliases main
          mike set-default --push main

  # Release: triggered after the github-release workflow completes successfully. Deploy the released
  # version under its tag and move the `latest` alias to it, then default the site to `latest`.
  deploy-release:
    # Security: when triggered via workflow_run, require the upstream run came from the base repo
    # (not a fork) so untrusted code never runs in a context holding the write token.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # head_branch (not head_sha): github-release pushes the version-bump commit AFTER the
          # workflow_run head_sha is captured, so the branch tip carries the released version while
          # head_sha would check out the pre-bump tree. The fork guard above keeps this safe.
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade "pip>=25.1"
      - run: python -m pip install --group docs
      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build site (strict)
        run: mkdocs build --strict
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy (mike) — release
        run: |
          mike deploy --push --update-aliases "${{ steps.version.outputs.tag }}" latest
          mike set-default --push latest
