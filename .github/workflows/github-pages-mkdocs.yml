name: Deploy MkDocs

# Mirrors pyramids-mesh: all the build/deploy logic lives in the shared
# serapeum-org/github-actions `mkdocs-deploy` composite action. The action sets up the pixi `docs`
# environment (install-groups: docs -> the `docs` pixi env, which has no QGIS and does not install
# this plugin, see pyproject.toml), builds the hand-written site, and publishes versioned docs with
# mike. Pins the same monorepo SHA tests.yml already uses (38c1110 == pixi/v1.2.1 == mkdocs/v1.3.1).
#
# Pages source requirement: mike publishes by committing the built site to the `gh-pages` branch, so
# the repo's Settings -> Pages -> Source must be "Deploy from a branch -> gh-pages". Needs the
# ACTIONS_DEPLOY_TOKEN secret (a token with Pages/contents write), same as pyramids-mesh.

permissions:
  contents: read  # top-level stays read-only; each deploy job grants its own contents: write (S8233).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  release:
    types:
      - published
  workflow_run:
    workflows: ['github-release']
    types: [completed]

jobs:
  deploy-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # mike pushes the built docs to the gh-pages branch.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: serapeum-org/github-actions/actions/mkdocs-deploy@38c111084f99d5ff5f4a1e63bedce48fe33a10c0  # mkdocs/v1.3.1
        with:
          trigger: 'pull_request'
          package-manager: 'pixi'
          install-groups: 'docs'
          deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: serapeum-org/github-actions/actions/mkdocs-deploy@38c111084f99d5ff5f4a1e63bedce48fe33a10c0  # mkdocs/v1.3.1
        with:
          trigger: 'main'
          package-manager: 'pixi'
          install-groups: 'docs'
          deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

  deploy-release:
    # Security: when triggered via workflow_run, require the upstream run came from the base repo (not
    # a fork) so untrusted code never runs in a context holding the deploy token.
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run'
       && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.head_repository.fork == false)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # SonarCloud S7631 (pwn-request) hardening for this workflow_run-triggered, write-token job:
          #   - repository: an explicit same-org repo (this repo) is trusted and not reported;
          #   - ref: a literal 'main', NOT the attacker-controllable workflow_run.head_branch, which the
          #     rule reports regardless of org.
          # github-release pushes the version-bump commit to main before this job runs, so main's tip
          # already carries the released version. (Releases are cut from main.) Still fork-guarded in `if:`.
          repository: ${{ github.repository }}
          ref: main

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: serapeum-org/github-actions/actions/mkdocs-deploy@38c111084f99d5ff5f4a1e63bedce48fe33a10c0  # mkdocs/v1.3.1
        with:
          trigger: 'release'
          package-manager: 'pixi'
          install-groups: 'docs'
          deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
          release-tag: ${{ github.event.release.tag_name || steps.version.outputs.tag }}
          mike-alias: 'latest'
