name: Wheel - Build & Test

# Validates the plugin's real supported install path, following pyramids-core's pure-wheel-test:
# build the wheel, then install it on top of a conda-forge (Miniforge) environment that provides the
# non-PyPI native dependency. For pyramids-core that dependency is GDAL; for this plugin it is
# **QGIS** — conda-forge ships `qgis` (PyQGIS), which is what lets the plugin's modules import at all.
# This is the ONE workflow that exercises the plugin against REAL PyQGIS (the unit suite in tests.yml
# is QGIS-free via the conftest stub).
#
# pyramids-core is installed from CONDA-FORGE, not the PyPI wheel: the PyPI wheel vendors its own GDAL,
# which conflicts with QGIS's (the exact case dependencies.py warns about). From conda-forge it binds
# to QGIS's GDAL — the plugin's documented supported setup. Hence `pip install ... --no-deps`: conda
# already provides qgis and pyramids-core, so pip must not pull the vendored-GDAL wheel on top.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - run: "python -m pip install --only-binary=:all: build==1.2.2"

      - name: Build the wheel
        run: python -m build --wheel --outdir dist/

      - name: Verify the wheel bundles the plugin metadata and resources
        run: |
          python -m zipfile -l dist/*.whl | grep "pyramids_qgis/metadata.txt"
          python -m zipfile -l dist/*.whl | grep "pyramids_qgis/resources/icon.png"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheel
          path: dist/*.whl

  test-wheel:
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # bash -el so the conda environment is activated for every run step (pyramids-core's pattern).
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wheel
          path: dist/

      - name: Install Conda (Miniforge)
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb  # v4.1.0
        with:
          miniforge-version: latest
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict
          activate-environment: wheel-test

      - name: Install QGIS and pyramids-core from conda-forge
        # QGIS is the non-PyPI native dependency (as GDAL is for pyramids-core). pyramids-core comes
        # from conda-forge too so it binds to QGIS's GDAL rather than vendoring its own.
        run: conda install -y -n wheel-test qgis pyramids-core

      - name: Install the plugin wheel (no deps — conda provides qgis + pyramids-core)
        run: pip install dist/*.whl --no-deps

      - name: Import the plugin against real PyQGIS
        # QT_QPA_PLATFORM=offscreen so importing qgis.core needs no display on the Linux runner.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import pyramids_qgis                     # import-light top package
          import pyramids_qgis.provider            # imports qgis.core — fails on a bare pip env
          from pyramids_qgis.algorithms import ALGORITHMS  # imports every algorithm module
          print(f"imported against real PyQGIS; {len(ALGORITHMS)} algorithms registered")
          assert len(ALGORITHMS) >= 10, "expected the full algorithm registry"
          PY
