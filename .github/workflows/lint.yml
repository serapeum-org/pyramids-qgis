name: CI

# Static checks for the plugin. Unlike pyramids, pyramids-qgis is not a pip-installable
# package and has no pixi env: it runs inside QGIS's own Python, which provides PyQGIS and
# GDAL. So CI cannot import the plugin (PyQGIS is absent on a bare runner) and instead does
# what it can without QGIS: run the whole pre-commit suite (ruff lint+format, bandit, checkov,
# shellcheck and the hygiene hooks) and byte-compile every module across
# the Python versions the plugin supports (those of its pyramids-core dependency, >= 3.11) to
# catch syntax errors. End-to-end behaviour is verified by running the algorithms inside QGIS,
# not here.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Mirrors pyramids-core: one job runs every hook in .pre-commit-config.yaml, so the gates a
  # contributor gets locally are exactly the gates CI enforces. This replaces the standalone
  # ruff steps that used to live here - ruff now runs as a hook, from the same pinned rev.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No fetch-depth: `pre-commit run --all-files` scans the working tree, not history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # Cache the hook toolchains (each hook repo builds an isolated env on first run).
      # Keyed on the config so a hook or rev bump rebuilds; restore-keys reuse the rest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-

      # Pin the resolved version (reproducible CI, and satisfies the supply-chain
      # "lock resolved versions" check); bump deliberately or via dependabot.
      # --only-binary=:all: forbids building from sdist, so no package setup script runs
      # (sonar githubactions:S8541) - the same guard the ruff/commitizen installs use.
      - run: "python -m pip install --only-binary=:all: pre-commit==4.5.1"

      - name: Run pre-commit hooks
        # --show-diff-on-failure prints exactly what the auto-fixers (ruff-format,
        # end-of-file-fixer, ...) would change, so a contributor sees the fix to apply.
        run: pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          # no-commit-to-branch: CI checks out a detached HEAD or the PR merge ref, so the
          #   branch guard is meaningless here (it is a local-commit guard).
          # gitleaks: the dedicated job below scans the whole tree with the pinned binary and
          #   the SHA256 check; running the hook too would duplicate it.
          # pixi-lock-check: needs pixi installed; tests.yml already installs both envs with
          #   --locked, which fails on a stale lock.
          SKIP: no-commit-to-branch,gitleaks,pixi-lock-check

  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The Python versions the plugin supports — i.e. those of its hard dependency
        # pyramids-core, which requires python >= 3.11 (so QGIS 3.22-LTR's python 3.9 is
        # NOT a target: it cannot import pyramids-core and the plugin cannot run on it).
        # compileall parses every module; it does not import PyQGIS, so it runs on a bare
        # runner.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all modules
        run: python -m compileall -q src/pyramids_qgis scripts

  # Secret gate, mirroring pyramids / pyramids-mesh. The pinned gitleaks binary (with a
  # SHA256 check) scans the whole working tree against the .github/gitleaks.toml allowlist;
  # `gitleaks dir` exits non-zero on a leak, failing the job.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Scan for secrets (gitleaks)
        run: |
          VER=8.30.0
          SHA=79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          curl -sSL --proto '=https' --proto-redir '=https' -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . -c .github/gitleaks.toml --redact --no-banner
