name: Release

# Build and publish the plugin on a version tag. qgis-plugin-ci packages pyramids_qgis/ into the
# uploadable zip, injects the CHANGELOG entry into metadata.txt, and attaches the zip plus a
# custom-repository plugins.xml to the GitHub Release for the tag. Publishing to the official
# repository (plugins.qgis.org) is deliberately NOT done here — that needs an OSGeo account and is
# tracked separately (#9); add `--osgeo-username`/`--osgeo-password` from secrets when ready.

on:
  push:
    tags:
      # Semver tags only (e.g. v0.1.0). A loose `v*` would also match `v1` / `vtest`, which
      # qgis-plugin-ci rejects as a non-x.y.z version — but only AFTER the Release was created.
      # (Actions tag filters are globs, not regex, so this requires the two dots, not digit classes.)
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write  # create the GitHub Release and upload the zip / plugins.xml assets

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # qgis-plugin-ci reads the changelog and tags from full history.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # Pin for reproducible releases; bump deliberately or via dependabot. --only-binary=:all:
      # forbids building from sdist, so no package setup script runs during install (sonar S8541).
      - run: "python -m pip install --only-binary=:all: qgis-plugin-ci==2.8.6"

      # qgis-plugin-ci's `release` only UPLOADS to an already-existing GitHub Release (with a token it
      # looks the release up and exits 1 if it is absent); pushing a tag does not create one. So create
      # the Release for the tag first, then let qgis-plugin-ci attach the assets to it.
      - name: Create the GitHub Release for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Idempotent: a re-run / retry (or a deleted-and-re-pushed tag) would otherwise fail here because
        # the release already exists, aborting under `set -e` before the upload step. Create only if absent.
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"

      - name: Build and upload the plugin to the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Strip the leading `v` for the plugin version written into metadata.txt (X.Y.Z), but pass the
        # real tag via --release-tag so the tool finds the vX.Y.Z Release and the --create-plugin-repo
        # plugins.xml download URLs point at .../releases/download/vX.Y.Z/. Without --release-tag the
        # tool reuses the stripped version as the tag and looks up a non-existent `X.Y.Z` release.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          qgis-plugin-ci release "${VERSION}" \
            --release-tag "${GITHUB_REF_NAME}" \
            --github-token "${GITHUB_TOKEN}" \
            --create-plugin-repo
