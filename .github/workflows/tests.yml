name: Tests

# The QGIS-free unit suite, split into its own workflow to mirror pyramids-mesh's layout. It covers
# the surface that does not need PyQGIS — the CLI runner and helpers (via the conftest qgis stub),
# the dependency probes, the provider's forced output extension and registry, and the deploy helper
# — so it runs on a bare runner with no QGIS installed. The PyQGIS-dependent behaviour
# (initAlgorithm / processAlgorithm) is out of scope here and verified inside QGIS (issue #3). Unlike
# mesh's pixi matrix, there is no package to install: the suite runs on a plain interpreter.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # --only-binary=:all: forbids building from sdist, so no package setup script runs (sonar S8541).
      - run: "python -m pip install --only-binary=:all: pytest==8.3.4"

      - name: Run the QGIS-free test suite
        run: python -m pytest tests/ -q
