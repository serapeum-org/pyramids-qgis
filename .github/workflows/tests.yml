name: Tests

# Mesh-style: the suite runs INSIDE the pixi `dev` environment, which conda-installs QGIS, so the
# tests exercise REAL PyQGIS — there is no import stub. The env is py313 only (conda-forge `qgis` 4.x
# has no older build). Starts on ubuntu (headless via QT_QPA_PLATFORM=offscreen); the windows/macos
# matrix can be added once this is green.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up the pixi dev env (conda qgis + pyramids)
        # serapeum-org/github-actions is a monorepo; this SHA is the pixi/v1.2.1 action. v0.73.0 pins
        # the pixi that wrote pixi.lock (format v7), so CI reads the lock the repo ships.
        uses: serapeum-org/github-actions/actions/python-setup/pixi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0  # pixi/v1.2.1
        with:
          environments: dev
          activate-environment: dev
          cache: true
          version: v0.73.0

      - name: Run the test suite against real QGIS
        run: pixi run -e dev test
