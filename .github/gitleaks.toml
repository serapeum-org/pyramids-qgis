# Gitleaks configuration, shared by both secret scans: the `gitleaks dir` sweep in
# .github/workflows/lint.yml and the local `gitleaks` pre-commit hook, which passes
# `--config .github/gitleaks.toml` because gitleaks only auto-discovers a config at
# the scan root. gitleaks is the repo's single secret scanner, matching pyramids,
# pyramids-mesh and pyramids-eo. It keeps gitleaks' full built-in ruleset and only
# allowlists paths that are working notes rather than source secrets.
title = "pyramids-qgis"

[extend]
useDefault = true

[allowlist]
description = "Non-source paths: working notes and review artifacts"
paths = [
  # Planning / review notes are working documents, not shipped code.
  '''(^|/)planning/''',
  # PR review artifacts written into the repo root are working documents.
  '''pr-diff-review-.*\.md$''',
]
