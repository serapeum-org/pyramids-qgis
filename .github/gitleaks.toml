# Gitleaks configuration for the CI secret scan (`gitleaks dir` in
# .github/workflows/lint.yml). gitleaks is the repo's single secret scanner,
# matching pyramids, pyramids-mesh and pyramids-eo. There is no local gitleaks
# pre-commit hook here, so this file is read only by that job. It keeps gitleaks'
# full built-in ruleset and only allowlists paths that are working notes rather
# than source secrets.
title = "pyramids-qgis"

[extend]
useDefault = true

[allowlist]
description = "Non-source paths: working notes and review artifacts"
paths = [
  # Planning / review notes are working documents, not shipped code.
  '''(^|/)planning/''',
  # PR review artifacts written into the repo root are working documents.
  '''pr-diff-review-.*\.md$''',
]
